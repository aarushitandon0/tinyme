[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-me"
version = "0.1.0"
description = "A local Windows desktop helper that circles what to click, for one non-technical person."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }

# Versions are deliberately lower-bounded for now. CLAUDE.md: pin once something works.
dependencies = [
    "PySide6>=6.6",
    "mss>=9.0",
    "rapidocr>=2.0",
    "onnxruntime>=1.17",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "ollama>=0.3",
    "pydantic>=2.6",
    "pynput>=1.7",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "Pillow>=10.2",
    "playwright>=1.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "sentry-sdk>=2.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
